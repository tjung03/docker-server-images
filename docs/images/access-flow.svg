<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">docker-server-images · 접근 흐름</title>
<desc id="desc">HTTP Client는 호스트 8080과 8443 포트를 통해 myweb의 80과 443 포트에 접근한다. 외부 Linux NFS Client는 TCP 2049를 통해 mynfs의 NFSv4 공유에 접근한다. 두 접근 경로는 서로 독립적이다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="390" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">docker-server-images · 접근 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">HTTP/HTTPS와 NFSv4를 서로 독립된 경로로 확인</text>

<rect x="32" y="108" width="936" height="105" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="52" y="140" font-size="17" font-weight="700" fill="#4865a0">WEB</text>
<rect x="185" y="129" width="190" height="62" rx="10" fill="#fff6ea" stroke="#e5cba9"/>
<text x="205" y="156" font-size="18" font-weight="700" fill="#946018">HTTP Client</text>
<text x="205" y="179" font-size="14" fill="#263a54">Browser / curl</text>
<rect x="625" y="129" width="210" height="62" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="645" y="156" font-size="18" font-weight="700" fill="#163b76">myweb · Apache</text>
<text x="645" y="179" font-size="14" fill="#263a54">:80 · :443</text>
<path d="M375 160 H615" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="444" y="147" font-size="13" fill="#64748b">Host 8080 / 8443</text>

<rect x="32" y="235" width="936" height="105" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>
<text x="52" y="267" font-size="17" font-weight="700" fill="#086b62">NFS</text>
<rect x="185" y="256" width="190" height="62" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="205" y="283" font-size="18" font-weight="700" fill="#086b62">Linux NFS Client</text>
<text x="205" y="306" font-size="14" fill="#263a54">외부 Host</text>
<rect x="625" y="256" width="210" height="62" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="645" y="283" font-size="18" font-weight="700" fill="#086b62">mynfs · NFSv4</text>
<text x="645" y="306" font-size="14" fill="#263a54">/share → /exports/share</text>
<path d="M375 287 H615" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="463" y="274" font-size="13" fill="#64748b">TCP 2049</text>
</g></svg>