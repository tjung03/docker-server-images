<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">docker-server-images · 현재 구현 범위</title>
<desc id="desc">현재 main에서 직접 빌드 가능한 WEB과 NFS 컨테이너 및 각각 연결된 Docker 볼륨을 보여준다. WEB의 web-html과 web-logs, NFS의 nfs-share는 서로 독립된 볼륨이다.</desc>
<rect width="1000" height="480" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">docker-server-images · 현재 구현 범위</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">현재 main에서 직접 빌드 가능한 WEB · NFS 기준</text>

<rect x="32" y="108" width="936" height="300" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="54" y="142" font-size="18" font-weight="700" fill="#4865a0">Docker Compose · infra-net</text>

<rect x="72" y="172" width="410" height="202" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="96" y="207" font-size="22" font-weight="700" fill="#163b76">myweb · Apache HTTP/HTTPS</text>
<text x="96" y="238" font-size="15" fill="#263a54">Container :80 · :443</text>
<rect x="96" y="268" width="160" height="72" rx="10" fill="#f5f8ff" stroke="#d4dbe7"/>
<text x="114" y="297" font-size="16" font-weight="700" fill="#163b76">web-html</text>
<text x="114" y="322" font-size="14" fill="#263a54">/var/www/html</text>
<rect x="278" y="268" width="160" height="72" rx="10" fill="#f5f8ff" stroke="#d4dbe7"/>
<text x="296" y="297" font-size="16" font-weight="700" fill="#163b76">web-logs</text>
<text x="296" y="322" font-size="14" fill="#263a54">/var/log/httpd</text>

<rect x="518" y="172" width="410" height="202" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="542" y="207" font-size="22" font-weight="700" fill="#086b62">mynfs · NFSv4 Server</text>
<text x="542" y="238" font-size="15" fill="#263a54">Container TCP 2049 · privileged</text>
<rect x="542" y="268" width="210" height="72" rx="10" fill="#ecf8f4" stroke="#a9d5c6"/>
<text x="560" y="297" font-size="16" font-weight="700" fill="#086b62">nfs-share</text>
<text x="560" y="322" font-size="14" fill="#263a54">/exports · fsid=0</text>

<rect x="32" y="430" width="936" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="450" font-size="14" fill="#475569">WEB의 web-logs와 NFS의 nfs-share는 별도 Volume · 현재 구성에는 WEB 로그를 NFS에 자동 Mount하는 연결이 없음</text>
</g></svg>