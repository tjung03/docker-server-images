<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">docker-server-images · 현재 구현 구조</title><desc id="desc">현재 main에서 직접 빌드 가능한 Apache WEB과 NFSv4 서버를 중심으로 외부 클라이언트, 게시 포트, Docker 볼륨을 보여준다. WEB과 NFS 사이에는 시작 순서 의존만 있고 볼륨이나 로그 공유 연결은 없다.</desc>
